name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable v* tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-production
  cancel-in-progress: false

jobs:
  publish:
    environment: npm-production
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must be an immutable v* semantic version"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
        working-directory: packages/cli
      - run: npm run typecheck
        working-directory: packages/cli
      - run: npm test
        working-directory: packages/cli
      - name: Require matching package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - name: Refuse an existing npm version
        working-directory: packages/cli
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "@segly/cli@$package_version" version >/dev/null 2>&1; then
            echo "@segly/cli@$package_version already exists and cannot be overwritten"
            exit 1
          fi
      - run: npm publish --access public --provenance --tag latest
        working-directory: packages/cli
