name: Public Agent CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  cli-and-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: packages/cli
      - run: npm run typecheck
        working-directory: packages/cli
      - run: npm test
        working-directory: packages/cli
      - run: npm pack --dry-run
        working-directory: packages/cli
      - run: node plugins/segly/evals/validate.mjs
      - name: Validate MCP Registry metadata against the published schema
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          curl --fail --show-error --silent \
            https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json \
            --output /tmp/mcp-server.schema.json
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          with open("/tmp/mcp-server.schema.json", encoding="utf-8") as handle:
              schema = json.load(handle)
          with open("server.json", encoding="utf-8") as handle:
              document = json.load(handle)
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(document)
          PY
