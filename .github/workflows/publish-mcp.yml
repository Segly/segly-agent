name: Publish MCP Registry metadata

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable v* tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must be an immutable v* semantic version"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          test "$(jq -r '.version' server.json)" = "$expected_version"
          test "$(jq -r '.name' server.json)" = "io.github.segly/segly"
          test "$(jq -r '.mcpName' packages/cli/package.json)" = "io.github.segly/segly"
          test "$(npm view "@segly/cli@$expected_version" version)" = "$expected_version"

      - name: Install pinned MCP publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json

      - name: Publish registry metadata
        run: ./mcp-publisher publish server.json
